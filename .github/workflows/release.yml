name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release (uses run number as version)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p release-keystore
            echo "$KEYSTORE_BASE64" | base64 -d > release-keystore/colortap-release.keystore
            cat > keystore.properties <<EOF
          storeFile=release-keystore/colortap-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare release artifacts
        run: |
          cp app/build/outputs/bundle/release/app-release.aab ColorTap.aab
          cp app/build/outputs/apk/debug/app-debug.apk ColorTap.apk

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: ColorTap-aab
          path: ColorTap.aab
          retention-days: 90

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorTap-apk
          path: ColorTap.apk
          retention-days: 90

      - name: Create GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ColorTap.aab
            ColorTap.apk
          generate_release_notes: true

      - name: Create GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manual-${{ github.run_number }}
          name: Color Tap build ${{ github.run_number }}
          files: |
            ColorTap.aab
            ColorTap.apk
          generate_release_notes: true
          prerelease: true
